name: Version and secrets
description: Set Version.targets and configure NuGet to resolve through Repox.

inputs:
  build-number:
    description: Build number used to set Version.targets.
    required: true
  short-version:
    description: Short version (e.g. 5.15) used to set Version.targets.
    required: true

runs:
  using: composite
  steps:
    - name: Set version
      shell: bash
      env:
        SHORT_VERSION:          ${{ inputs.short-version }}
        BUILD_BUILDID:          ${{ inputs.build-number }}
        BUILD_SOURCEBRANCHNAME: ${{ github.ref_name }}
        BUILD_SOURCEVERSION:    ${{ github.sha }}
      run: ${{ runner.os == 'Windows' && 'powershell' || 'pwsh' }} -File ./scripts/set-version-ci.ps1

    # Points NuGet.Config at the Edge and exports ARTIFACTORY_USER / ARTIFACTORY_PASSWORD for its credentials.
    - name: Config NuGet
      uses: SonarSource/ci-github-actions/config-nuget@v2
      with:
        artifactory-reader-role: private-reader
        repox-url: https://repox.sonar.build
