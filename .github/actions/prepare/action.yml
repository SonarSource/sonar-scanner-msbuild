name: Prepare
description: Install tools, cache NuGet, fetch secrets, compute version, and restore.

inputs:
  build-number:
    description: Build number used to set Version.targets before building.
    required: true
  short-version:
    description: Short version (e.g. 5.15) used to set Version.targets before building.
    required: true

runs:
  using: composite
  steps:
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Validate Renovate .NET SDK version
      shell: powershell
      run: |
        $GlobalVersion = (Get-Content global.json -Raw | ConvertFrom-Json).sdk.version
        $RenovateConfig = Get-Content .github/renovate.json -Raw | ConvertFrom-Json
        $RenovateRule = $RenovateConfig.packageRules |
          Where-Object { $null -ne $_.postUpgradeTasks -and $null -ne $_.constraints.dotnet } |
          Select-Object -First 1
        $RenovateVersion = $RenovateRule.constraints.dotnet
        $InstalledVersion = dotnet --version

        if ($RenovateVersion -ne $GlobalVersion -or $InstalledVersion -ne $GlobalVersion) {
          throw "SDK version mismatch: Renovate=$RenovateVersion, global.json=$GlobalVersion, installed=$InstalledVersion"
        }

    - name: Version and secrets
      uses: ./.github/actions/version-and-secrets
      with:
        build-number: ${{ inputs.build-number }}
        short-version: ${{ inputs.short-version }}

    # The cache bucket is the current month. It's part of the cache key so the cache
    # rotates monthly, preventing it from growing unbounded with stale packages.
    # Get-Date can't be called inside a ${{ }} expression, so it's computed here.
    # see: https://docs.github.com/en/actions/reference/workflows-and-actions/expressions
    - name: Setup cache month variable
      id: cache-month
      shell: powershell
      run: |
        "CACHE_MONTH=$(Get-Date -Format 'MM')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Cache NuGet packages
      uses: SonarSource/gh-action_cache@v1
      with:
        path: ${{ github.workspace }}/.nuget/packages
        key: nuget-${{ steps.cache-month.outputs.CACHE_MONTH }}-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: nuget-${{ steps.cache-month.outputs.CACHE_MONTH }}-

    - name: Restore
      shell: powershell
      env:
        NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      run: dotnet restore SonarScanner.MSBuild.sln --locked-mode --configfile "NuGet.Config"
