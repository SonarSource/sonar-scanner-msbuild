name: ITs Unix
description: >-
  Shared IT runner for the Linux and macOS ITs jobs: installs toolchains, creates the self-signed
  certificate needed by SslTest, configures Maven, runs the Maven ITs for one matrix leg via
  scripts/run-its.sh, and publishes the results. Not used by the Windows ITs job (separate
  toolchain needs; see run-its.sh's Windows-only branches, which this action never sets env vars for).

inputs:
  scenario:
    description: Matrix leg name (e.g. LATEST_RELEASE, Others, Cloud), used only for step/check-run display names.
    required: true
  test-include:
    description: Value passed through to run-its.sh as TEST_INCLUDE (e.g. "**/sonarqube/*").
    required: true
  sq-version:
    description: >-
      Value passed through to run-its.sh as SQ_VERSION. Omit for legs that don't boot a local SonarQube server.
    required: false
    default: ""
  sonarcloud-project-token:
    description: >-
      SonarCloud project token for the Cloud leg.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Java, Maven, .NET and Node
      uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      with:
        cache: true
        tool_versions: |
          java temurin-21
          maven 3.9.15
          dotnet 11.0.100-rc.2.26504.105 10 9 8
          node 24

    - name: Download Binaries artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: Binaries
        path: Packaging/Binaries

    # Needed for the SslTest integration test, which only runs as part of the LATEST_RELEASE leg (**/sonarqube/*).
    - name: Create self-signed certificate
      if: inputs.scenario == 'LATEST_RELEASE'
      shell: bash
      run: bash scripts/ci-self-signed-certificate.sh

    - name: Fetch Vault Secrets
      id: secrets
      uses: SonarSource/vault-action-wrapper@v3
      with:
        secrets: |
          development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader username     | ARTIFACTORY_USER;
          development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_PASSWORD;
          development/github/token/licenses-ro token                                       | GH_LICENSES_TOKEN;

    # GitHub-hosted macOS cannot reach the internal Edge node.
    - name: Configure Maven
      uses: SonarSource/ci-github-actions/config-maven@2.3.0
      with:
        artifactory-reader-role: private-reader
        repox-url: ${{ runner.os == 'macOS' && 'https://repox.jfrog.io' || 'https://repox-internal.dev.sonar.build' }}
        working-directory: its
      # Opts config-maven out of its automatic build-number bump. Otherwise it would update pom.xml with wrong values.
      # We do not deploy, so dummy values are fine.
      env:
        CURRENT_VERSION: unused
        PROJECT_VERSION: unused

    - name: Fetch production Edge reader token
      if: runner.os != 'macOS'
      id: orchestrator-secrets
      uses: SonarSource/vault-action-wrapper@v3
      with:
        secrets: |
          development/artifactory-edge-prod/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ORCHESTRATOR_ACCESS_TOKEN;

    - name: Configure Orchestrator downloads
      shell: bash
      env:
        ORCHESTRATOR_HOME: ${{ runner.temp }}/orchestrator
        ORCHESTRATOR_ARTIFACTORY_URL: ${{ runner.os == 'macOS' && 'https://repox.jfrog.io/artifactory' || 'https://repox-internal.sonar.build/artifactory' }}
        ORCHESTRATOR_ACCESS_TOKEN: ${{ runner.os != 'macOS' && fromJSON(steps.orchestrator-secrets.outputs.vault).ORCHESTRATOR_ACCESS_TOKEN || env.ARTIFACTORY_ACCESS_TOKEN }}
      run: |
        set -euo pipefail
        : "${ORCHESTRATOR_ACCESS_TOKEN:?Orchestrator reader token is required}"
        umask 077
        if [ "$RUNNER_OS" = "Windows" ]; then
          ORCHESTRATOR_HOME="$(cygpath -u "$ORCHESTRATOR_HOME")"
        fi
        mkdir -p "$ORCHESTRATOR_HOME"
        config_path="$ORCHESTRATOR_HOME/orchestrator.properties"
        printf 'orchestrator.artifactory.url=%s\norchestrator.artifactory.accessToken=%s\n' \
          "$ORCHESTRATOR_ARTIFACTORY_URL" "$ORCHESTRATOR_ACCESS_TOKEN" > "$config_path"
        if [ "$RUNNER_OS" = "Windows" ]; then
          config_url="file:///$(cygpath -m "$config_path")"
        else
          config_url="file://$config_path"
        fi
        echo "ORCHESTRATOR_CONFIG_URL=$config_url" >> "$GITHUB_ENV"

    - name: Run Maven ITs
      env:
        MAVEN_OPTS: -Xmx3072m
        TEST_INCLUDE: ${{ inputs.test-include }}
        SQ_VERSION: ${{ inputs.sq-version }}
        SQ_EDITION: DEVELOPER
        ARTIFACTORY_USER: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USER }}
        ARTIFACTORY_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_PASSWORD }}
        ORCHESTRATOR_HOME: ${{ runner.temp }}/orchestrator
        GITHUB_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).GH_LICENSES_TOKEN }}
        SONARCLOUD_PROJECT_TOKEN: ${{ inputs.sonarcloud-project-token }}
        SONARCLOUD_URL: https://sc-staging.io/
        SONARCLOUD_API_URL: https://api.sc-staging.io
        SONARCLOUD_ORGANIZATION: s4net-its
      shell: bash
      run: bash scripts/run-its.sh

    - name: Remove Orchestrator credentials
      if: always()
      shell: bash
      env:
        ORCHESTRATOR_HOME: ${{ runner.temp }}/orchestrator
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then
          ORCHESTRATOR_HOME="$(cygpath -u "$ORCHESTRATOR_HOME")"
        fi
        rm -f "$ORCHESTRATOR_HOME/orchestrator.properties"

    - name: Publish test results
      uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
      if: ${{ !cancelled() }}
      with:
        name: ITs ${{ runner.os }} (${{ inputs.scenario }})
        path: its/target/surefire-reports/TEST-*.xml
        reporter: java-junit
        fail-on-error: false
