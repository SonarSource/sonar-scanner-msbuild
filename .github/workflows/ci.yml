name: BUILD-13211 temporary NuGet evidence

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Empty-cache NuGet (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Windows
            runner: warp-custom-dotnet-bubble-ci
          - os: Linux
            runner: sonar-xs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install tools on Linux
        if: runner.os == 'Linux'
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550
        with:
          cache: true
          tool_versions: |
            powershell-core 7.5.4
            dotnet 11.0.100-rc.3.26522.148

      - name: Install repository .NET SDK on Windows
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Seed unrelated Artifactory environment
        shell: bash
        run: |
          for variable in ARTIFACTORY_URL ARTIFACTORY_USERNAME ARTIFACTORY_ACCESS_TOKEN ARTIFACTORY_USER ARTIFACTORY_PASSWORD ARTIFACTORY_READER_ROLE; do
            printf '%s=unchanged-%s\n' "$variable" "$variable" >> "$GITHUB_ENV"
          done

      - name: Configure production Edge and matching native reader
        uses: ./.github/actions/configure-nuget
        with:
          use-prod-edge: 'true'

      - name: Validate Edge downloads from empty caches
        shell: pwsh
        run: ./scripts/validate-nuget-transfer.ps1 -Mode edge -ReaderRole 'production-native sonar-scanner-msbuild private-reader'

      - name: Configure SaaS and matching SaaS reader
        uses: ./.github/actions/configure-nuget
        with:
          use-prod-edge: 'false'

      - name: Validate SaaS rollback from separate empty caches
        shell: pwsh
        run: ./scripts/validate-nuget-transfer.ps1 -Mode saas -ReaderRole 'SaaS sonar-scanner-msbuild private-reader'

      - name: Upload credential-free summaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: BUILD-13211-nuget-evidence-${{ matrix.os }}
          path: edge-validation-evidence/**/*.json
          if-no-files-found: error
