name: CI

on:
  schedule:
    - cron: '17 2 * * 1-5' # Mon-Fri 2:17 AM UTC
  push:
    branches: [master, 'branch-*', 'feature/*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

env:
  NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

jobs:
  version:
    name: Compute version
    runs-on: sonar-xs
    permissions:
      id-token: write
    outputs:
      BUILD_NUMBER: ${{ steps.get-build-number.outputs.BUILD_NUMBER }}
      SHORT_VERSION: ${{ steps.set-version.outputs.SHORT_VERSION }}
      FULL_VERSION: ${{ steps.set-version.outputs.FULL_VERSION }}
      PATCH_VERSION: ${{ steps.set-version.outputs.PATCH_VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Get build number
        uses: SonarSource/ci-github-actions/get-build-number@v1
        id: get-build-number

      - name: Set version
        id: set-version
        run: |
          SHORT_VERSION=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('Version.targets').getroot().find('.//ShortVersion').text.strip())")
          if [ "$(echo "$SHORT_VERSION" | tr -cd '.' | wc -c)" -eq 1 ]; then
            PATCH_VERSION="$SHORT_VERSION.0"
          else
            PATCH_VERSION="$SHORT_VERSION"
          fi
          FULL_VERSION="$PATCH_VERSION.${{ steps.get-build-number.outputs.BUILD_NUMBER }}"
          echo "SHORT_VERSION=$SHORT_VERSION" >> "$GITHUB_OUTPUT"
          echo "PATCH_VERSION=$PATCH_VERSION" >> "$GITHUB_OUTPUT"
          echo "FULL_VERSION=$FULL_VERSION"   >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: version
    runs-on: warp-custom-dotnet-bubble-ci
    permissions:
      id-token: write
      contents: read
    env:
      BUILD_NUMBER: ${{ needs.version.outputs.BUILD_NUMBER }}
      SHORT_VERSION: ${{ needs.version.outputs.SHORT_VERSION }}
      FULL_VERSION: ${{ needs.version.outputs.FULL_VERSION }}
      PATCH_VERSION: ${{ needs.version.outputs.PATCH_VERSION }}
      PACKAGING_BINARIES: Packaging/Binaries
      PACKAGING_BINARIES_NET: Packaging/Binaries/Net
      PACKAGING_BINARIES_NET_FRAMEWORK: Packaging/Binaries/Net-Framework
      PACKAGING_BINARIES_NUGET: Packaging/Binaries/NuGet
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Prepare
        id: prepare
        uses: ./.github/actions/prepare
        with:
          nuget-packages-path: ${{ env.NUGET_PACKAGES }}
          build-number: ${{ env.BUILD_NUMBER }}
          short-version: ${{ env.SHORT_VERSION }}

      - name: Generate SBOM
        run: dotnet CycloneDX SonarScanner.MSBuild.sln -t --json -o $env:PACKAGING_BINARIES

      - name: Build
        run: dotnet build SonarScanner.MSBuild.sln --no-restore -c Release /m

      - name: Sign DLLs
        uses: SonarSource/gh-action_azure-artifact-signing@v1
        with:
          files: |
            ${{ env.PACKAGING_BINARIES_NET }}/Sonar*.dll
            ${{ env.PACKAGING_BINARIES_NET }}/Sonar*.exe
            ${{ env.PACKAGING_BINARIES_NET_FRAMEWORK }}/Sonar*.dll
            ${{ env.PACKAGING_BINARIES_NET_FRAMEWORK }}/Sonar*.exe

      - name: Zip .NET packages
        run: |
          function Zip-Assemblies([string]$Source, [string]$Destination) {
              # Don't use Compress-Archive because https://github.com/SonarSource/sonar-scanner-msbuild/issues/2086
              tar -c -a -C "$Source" --options "zip:compression-level=9" -f "$Destination" *
          }

          Zip-Assemblies "$env:PACKAGING_BINARIES_NET" "$env:PACKAGING_BINARIES/sonar-scanner-$env:FULL_VERSION-net.zip"
          Zip-Assemblies "$env:PACKAGING_BINARIES_NET_FRAMEWORK" "$env:PACKAGING_BINARIES/sonar-scanner-$env:FULL_VERSION-net-framework.zip"

      - name: Package dotnet global tool
        run: nuget pack Packaging\NuGet\dotnet-sonarscanner.nuspec -Version $env:PATCH_VERSION -OutputDirectory $env:PACKAGING_BINARIES_NUGET

      - name: Generate Choco packages
        run: . .\scripts\create-choco-packages.ps1

      # We can't use Azure Artifact Signing for NuGets: https://github.com/NuGet/NuGetGallery/issues/10027
      - name: Sign NuGet package
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/branch-')
        uses: SonarSource/core-languages-tooling-public/dotnet_pipeline/digicert-sign@master
        with:
          files: ${{ env.PACKAGING_BINARIES_NUGET }}/dotnet-sonarscanner*.nupkg

      - name: Run packaging tests
        env:
          IS_RELEASE_BRANCH: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/branch-') }}
        run: dotnet test Tests\SonarScanner.MSBuild.PackagingTest\SonarScanner.MSBuild.PackagingTest.csproj --configuration Release --no-build --no-restore

      - name: Set Maven project version
        env:
          SHORT_VERSION: ${{ needs.version.outputs.SHORT_VERSION }}
          FULL_VERSION: ${{ needs.version.outputs.FULL_VERSION }}
        run: |
          "CURRENT_VERSION=$env:SHORT_VERSION" >> $env:GITHUB_ENV
          "PROJECT_VERSION=$env:FULL_VERSION" >> $env:GITHUB_ENV

      - name: Stage to repox
        uses: SonarSource/ci-github-actions/build-maven@v1
        with:
          deploy-pull-request: true
          sonar-platform: none
          maven-args: -Dmaven.test.skip=true

      - name: Upload binaries as pipeline artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Binaries
          path: ${{ env.PACKAGING_BINARIES }}
          retention-days: 1
          if-no-files-found: error

  qa_windows:
    name: QA Windows - UTs and analysis
    needs: version
    runs-on: warp-custom-dotnet-bubble-ci
    permissions:
      id-token: write
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          nuget-packages-path: ${{ env.NUGET_PACKAGES }}
          build-number: ${{ needs.version.outputs.BUILD_NUMBER }}
          short-version: ${{ needs.version.outputs.SHORT_VERSION }}

      - name: Fetch Vault Secrets
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/kv/data/sonarcloud token | SONAR_TOKEN;

      - name: Cache SonarScanner for .NET
        id: s4net-cache
        uses: SonarSource/gh-action_cache@v1
        with:
          path: ${{ env.NUGET_PACKAGES }}\dotnet-sonarscanner
          key: s4net-${{ hashFiles('.config/dotnet-tools.json') }}

      - name: Restore SonarScanner for .NET
        run: dotnet tool restore --tool-manifest .config/dotnet-tools.json --configfile "NuGet.Config"

      - name: SonarQube Analysis begin
        env:
          SONAR_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).SONAR_TOKEN }}
        run: >
          dotnet tool run dotnet-sonarscanner -- begin
          /o:"sonarsource"
          /k:"sonarscanner-msbuild"
          /v:"${{ needs.version.outputs.SHORT_VERSION }}"
          /d:sonar.token="$env:SONAR_TOKEN"
          /d:sonar.cs.opencover.reportsPaths="${{ github.workspace }}\Coverage\*.xml"
          /d:sonar.cs.vstest.reportsPaths="${{ github.workspace }}\TestResults\*.trx"
          /d:sonar.sca.exclusions="its/projects/**"

      - name: Build and analyze
        run: dotnet build SonarScanner.MSBuild.sln --no-restore -c Release /p:RunAnalyzers=true /p:RunAnalyzersDuringBuild=true

      - name: Run UTs and compute coverage
        run: .\scripts\run-unit-tests.ps1 -SourcesDirectory "${{ github.workspace }}" -BuildConfiguration Release

      - name: Publish test results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() }}
        with:
          name: Unit Test Results
          path: TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: false

      - name: Delete files created by unit tests
        run: |
          Get-ChildItem "${{ runner.temp }}" -Filter 'dummy.*' -Recurse -Attributes !Directory | Remove-Item

      - name: SonarQube Analysis end
        env:
          SONAR_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).SONAR_TOKEN }}
        run: dotnet tool run dotnet-sonarscanner -- end /d:sonar.token="$env:SONAR_TOKEN"

  its_windows:
    name: ITs Windows
    needs: [version, build]
    uses: ./.github/workflows/its-windows.yml
    permissions:
      id-token: write
      contents: read
      checks: write
    with:
      short-version: ${{ needs.version.outputs.SHORT_VERSION }}
      full-version: ${{ needs.version.outputs.FULL_VERSION }}
    secrets:
      SONARCLOUD_PROJECT_TOKEN: ${{ secrets.SONARCLOUD_PROJECT_TOKEN }}

  qa_linux:
    name: QA Linux - UTs
    needs: [version, build]
    runs-on: sonar-xs
    permissions:
      id-token: write
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install tools
        uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4.0.0
        with:
          cache: true
          tool_versions: |
            dotnet 9
            powershell-core 7.5.4

      #
      - name: Make dotnet discoverable at the well-known Linux path
        run: sudo ln -sfn "$(command -v dotnet)" /usr/local/bin/dotnet

      - name: QA UTs
        uses: ./.github/actions/qa-unix
        with:
          build-number: ${{ needs.version.outputs.BUILD_NUMBER }}
          short-version: ${{ needs.version.outputs.SHORT_VERSION }}
          rid: linux-x64
          os-name: Linux

  qa_macos:
    name: QA macOS - UTs
    needs: [version, build]
    runs-on: macos-latest-xlarge
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/branch-')
    permissions:
      id-token: write
      contents: read
      checks: write
    steps:
      - name: Setup Cloudflare WARP
        uses: SonarSource/gh-action_setup-cloudflare-warp@v1
        id: warp

      - name: Remove pre-existing .bash_profile
        run: rm -f ~/.bash_profile

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: QA UTs
        uses: ./.github/actions/qa-unix
        with:
          build-number: ${{ needs.version.outputs.BUILD_NUMBER }}
          short-version: ${{ needs.version.outputs.SHORT_VERSION }}
          rid: osx-arm64
          os-name: MacOS

  its:
    name: ITs Linux (${{ matrix.scenario }})
    needs: build
    # Ported from azure-pipelines.yml's Unix ITs, which only run on master (slow, and unrelated to most PRs).
    # workflow_dispatch is additionally allowed so this can be triggered manually from any branch, e.g. while iterating on this job.
    if: github.ref_name == 'master' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runsOn }}
    permissions:
      id-token: write
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        scenario: [LATEST_RELEASE, Others]
        include:
          # sonar-xs was observed to be too small for this scenario (runner lost communication with the server, most likely
          # OOM-killed): it boots a real SonarQube Developer Edition server via Orchestrator and runs many more tests,
          # including npm-based frontend builds, unlike Others. Bumped one size up per the "start small, scale up only if
          # observed to be memory-bound" runner convention.
          - scenario: LATEST_RELEASE
            product: SonarQube
            sqVersion: LATEST_RELEASE
            testInclude: "**/sonarqube/*"
            runsOn: sonar-s
          - scenario: Others
            product: others
            sqVersion: ""
            testInclude: "**/others/*"
            runsOn: sonar-xs
    env:
      # Matches the Xmx used by the Azure equivalent (templates/its-jobs.yml). config-maven defaults to -Xmx1536m, which is too
      # small for the Orchestrator-driven ITs.
      MAVEN_OPTS: -Xmx3072m
      # Opts config-maven out of its automatic -SNAPSHOT -> build-number version bump: the ITs don't publish anything, so the
      # root pom.xml's real release version must not be touched by this job.
      CURRENT_VERSION: unused
      PROJECT_VERSION: unused
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install Java, Maven, .NET and Node
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          cache: true
          tool_versions: |
            java temurin-21
            maven 3.9.15
            dotnet 10.0.100
            node 20

      - name: Download Binaries artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Binaries
          path: Packaging/Binaries

      # Reimplemented in bash rather than calling scripts/ci-self-signed-certificate.ps1 directly: that script is also used,
      # unmodified, by azure-pipelines.yml on Microsoft-hosted Unix agents, and depends on Azure-only env vars
      # (BUILD_SOURCESDIRECTORY, AGENT_OS, JAVA_HOME_17_X64) and ADO log commands (##vso[task.setvariable]) that don't exist on
      # GitHub Actions/sonar-xs. Needed for the SslTest integration test.
      - name: Create self-signed certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p certs
          openssl req -newkey rsa:2048 -x509 -sha256 -addext "subjectAltName = DNS:localhost" -nodes \
            -out certs/system-trusted.crt -subj "/C=CS/ST=U/L=U/O=U/OU=U" -keyout certs/system-trusted.key
          openssl pkcs12 -export -out certs/system-trusted.p12 -inkey certs/system-trusted.key -in certs/system-trusted.crt \
            -passout pass:changeit
          keytool -import -storepass changeit -noprompt -cacerts -alias system-trusted -file certs/system-trusted.crt
          sudo cp certs/system-trusted.crt /usr/local/share/ca-certificates/system-trusted.crt
          sudo update-ca-certificates
          echo "SSL_KEYSTORE_PATH=$GITHUB_WORKSPACE/certs/system-trusted.p12" >> "$GITHUB_ENV"
          echo "SSL_KEYSTORE_PASSWORD=changeit" >> "$GITHUB_ENV"

      - name: Fetch Vault Secrets
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader username     | ARTIFACTORY_USER;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_TOKEN;
            development/github/token/licenses-ro token                                       | GITHUB_TOKEN;

      - name: Configure Maven
        uses: SonarSource/ci-github-actions/config-maven@v1
        with:
          artifactory-reader-role: private-reader

      - name: Configure NPM
        uses: SonarSource/ci-github-actions/config-npm@v1
        with:
          artifactory-reader-role: private-reader

      # SQ_EDITION defaults to DEVELOPER (matching templates/its-jobs.yml), hence the licenses-ro GITHUB_TOKEN: Orchestrator
      # uses it to fetch a Developer Edition license from the private licenses repo.
      # msbuild.path/platformtoolset/windowssdk are intentionally omitted: BuildCommand/MSBuildVersionCondition in the IT
      # harness only read them when OSPlatform.isWindows(), so they're simply unused here (see its/src/test/java/.../utils).
      - name: Run Maven ITs for ${{ matrix.product }}
        env:
          ARTIFACTORY_USER: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USER }}
          ARTIFACTORY_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_TOKEN }}
          ARTIFACTORY_QA_READER_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_TOKEN }}
          ARTIFACTORY_ACCESS_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_TOKEN }}
          GITHUB_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).GITHUB_TOKEN }}
        run: >-
          mvn -f its/pom.xml verify -B -e
          -Denable-repo=qa
          -Dtest=${{ matrix.testInclude }}
          -Dsonar.csharpplugin.version=DEV
          -Dsonar.vbnetplugin.version=DEV
          -Dsonar.dreplugin.version=LATEST_RELEASE
          -Dsonar.cfamilyplugin.version=LATEST_RELEASE
          -Dsonar.xmlplugin.version=LATEST_RELEASE
          -Dsonar.css.version=NONE
          -Dsonar.javascriptplugin.version=LATEST_RELEASE
          -Dsonar.plsqlplugin.version=LATEST_RELEASE
          -Dsonar.pythonplugin.version=LATEST_RELEASE
          -Dsonar.phpplugin.version=LATEST_RELEASE
          -Dsonar.iacplugin.version=NONE
          -Dsonar.iacplugin-enterprise.version=LATEST_RELEASE
          -Dsonar.javaplugin.version=LATEST_RELEASE
          -Dsonar.textplugin.version=LATEST_RELEASE
          -Dsonar.rubyplugin.version=LATEST_RELEASE
          -Dsonar.goplugin.version=NONE
          -Dsonar.goplugin-enterprise.version=LATEST_RELEASE
          -Dgo.groupid=org.sonarsource.go
          -Dsonar.tsqlplugin.version=LATEST_RELEASE
          -Dsonar.runtimeVersion=${{ matrix.sqVersion }}
          -Dsonar.sonarQubeEdition=DEVELOPER

      - name: Publish test results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() }}
        with:
          name: ITs Linux (${{ matrix.scenario }})
          path: its/target/surefire-reports/TEST-*.xml
          reporter: java-junit

      # Matches templates/its-jobs.yml's revertPomChanges step: something in the reactor (parent-oss profiles) rewrites
      # pom.xml during the Maven run; revert it so the next run's cache key (based on committed pom.xml content) stays stable.
      - name: Revert changes made to pom.xml to not break cache feature
        if: success()
        run: git checkout -- pom.xml its/pom.xml
