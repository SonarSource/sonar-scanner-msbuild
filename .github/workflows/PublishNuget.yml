name: Publish NuGet
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 10.1.0.12345)"
        required: true
        type: string
      dry-run:
        description: "Dry run: skip publish, show summary only"
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: "Release version (e.g. 10.1.0.12345)"
        required: true
        type: string
      dry-run:
        description: "Dry run: skip publish, show summary only"
        type: boolean
        default: false

jobs:
  publish-nuget:
    name: Publish to NuGet
    runs-on: sonar-xs
    permissions:
      id-token: write
      contents: write
    env:
      PACKAGE_NAME: sonar-scanner-${{ inputs.version }}.nupkg
    steps:
      - name: Install tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: true
          tool_versions: |
            dotnet 11.0.100-rc.2.26504.105
            github-cli 2.92

      - name: Download release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          gh release download "$RELEASE_VERSION" \
            --repo "${{ github.repository }}" \
            --pattern "$PACKAGE_NAME" \
            --dir "$RUNNER_TEMP/packages"

          if [ ! -f "$RUNNER_TEMP/packages/$PACKAGE_NAME" ]; then
            echo "::error::Package $PACKAGE_NAME not found in release $RELEASE_VERSION"
            exit 1
          fi

          echo "Downloaded: $PACKAGE_NAME"

      - name: NuGet login
        id: nuget-login
        if: ${{ !inputs.dry-run }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: SonarTech

      - name: Publish dotnet-sonarscanner to NuGet
        if: ${{ !inputs.dry-run }}
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGES_DIR: ${{ runner.temp }}/packages
        run: |
          echo "Publishing $PACKAGE_NAME to NuGet..."
          dotnet nuget push "${PACKAGES_DIR}/${PACKAGE_NAME}" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json

      - name: Summary
        if: ${{ inputs.dry-run }}
        shell: bash
        run: |
          echo "## Dry Run Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The following package would have been published to NuGet:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${PACKAGE_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
